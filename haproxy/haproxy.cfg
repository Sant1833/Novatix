global
    log stdout format raw local0
    maxconn 2048

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

frontend http_front
    bind *:8080
    stats enable
    stats uri /haproxy?stats
    stats auth admin:admin

    acl path_apuestas path_beg /apuestas /api/apuestas
    acl path_usuarios path_beg /usuarios /api/usuarios
    acl path_partidos path_beg /partidos /api/partidos
    acl path_dinero   path_beg /dinero   /api/dinero
    acl path_equipos  path_beg /equipos  /api/equipos

    use_backend be_apuestas if path_apuestas
    use_backend be_usuarios if path_usuarios
    use_backend be_partidos if path_partidos
    use_backend be_dinero   if path_dinero
    use_backend be_equipos  if path_equipos
    default_backend be_partidos

backend be_apuestas
    balance roundrobin
    server-template srv 1-5 novatix_apuestas:3000 check resolvers docker_dns init-addr none

backend be_usuarios
    balance roundrobin
    server-template srv 1-5 novatix_usuarios:3001 check resolvers docker_dns init-addr none

backend be_partidos
    balance roundrobin
    server-template srv 1-5 novatix_partidos:3002 check resolvers docker_dns init-addr none

backend be_dinero
    balance roundrobin
    server-template srv 1-5 novatix_dinero:3003 check resolvers docker_dns init-addr none

backend be_equipos
    balance roundrobin
    server-template srv 1-5 novatix_equipos:3004 check resolvers docker_dns init-addr none
